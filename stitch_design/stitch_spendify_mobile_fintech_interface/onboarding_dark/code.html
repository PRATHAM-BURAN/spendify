<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Spendify - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-tint": "#c0c1ff",
                        "on-tertiary-fixed": "#2a1700",
                        "on-secondary": "#003824",
                        "surface": "#13131b",
                        "surface-bright": "#393841",
                        "primary-fixed-dim": "#c0c1ff",
                        "surface-dim": "#13131b",
                        "outline-variant": "#464554",
                        "on-secondary-fixed": "#002113",
                        "inverse-surface": "#e4e1ed",
                        "surface-variant": "#34343d",
                        "on-tertiary-fixed-variant": "#653e00",
                        "surface-container": "#1f1f27",
                        "on-primary": "#1000a9",
                        "primary-fixed": "#e1e0ff",
                        "background": "#13131b",
                        "primary-container": "#8083ff",
                        "secondary-container": "#00a572",
                        "on-primary-fixed": "#07006c",
                        "tertiary": "#ffb95f",
                        "on-tertiary-container": "#3e2400",
                        "on-tertiary": "#472a00",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "surface-container-highest": "#34343d",
                        "error": "#ffb4ab",
                        "secondary": "#4edea3",
                        "on-background": "#e4e1ed",
                        "on-surface": "#e4e1ed",
                        "secondary-fixed-dim": "#4edea3",
                        "secondary-fixed": "#6ffbbe",
                        "surface-container-high": "#292932",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-primary-container": "#0d0096",
                        "surface-container-low": "#1b1b23",
                        "inverse-primary": "#494bd6",
                        "tertiary-container": "#ca8100",
                        "tertiary-fixed": "#ffddb8",
                        "on-surface-variant": "#c7c4d7",
                        "inverse-on-surface": "#303038",
                        "outline": "#908fa0",
                        "surface-container-lowest": "#0d0d15",
                        "on-secondary-fixed-variant": "#005236",
                        "on-secondary-container": "#00311f",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "primary": "#c0c1ff"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "lg": "32px",
                        "xl": "48px",
                        "base": "4px",
                        "sm": "16px",
                        "xs": "8px",
                        "safe-margin": "20px",
                        "md": "24px"
                    },
                    fontFamily: {
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "numeric-xl": ["Inter"]
                    },
                    fontSize: {
                        "headline-lg-mobile": ["24px", { lineHeight: "30px", fontWeight: "600" }],
                        "headline-lg": ["28px", { lineHeight: "34px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "label-md": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "500" }],
                        "display-lg": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "numeric-xl": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            font-family: 'Inter', sans-serif;
        }
        .glass-panel {
            background: rgba(41, 41, 50, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(199, 196, 215, 0.1);
        }
        .glow-effect {
            box-shadow: 0 0 32px rgba(128, 131, 255, 0.15);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between overflow-hidden relative">
<!-- Ambient Background Glow -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute -top-[20%] -right-[20%] w-[70vw] h-[70vw] rounded-full bg-primary-container/20 blur-[120px]"></div>
<div class="absolute -bottom-[20%] -left-[20%] w-[80vw] h-[80vw] rounded-full bg-primary-container/10 blur-[120px]"></div>
</div>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center px-safe-margin z-10 w-full max-w-md mx-auto">
<!-- Illustration Container -->
<div class="w-full aspect-square mb-lg relative flex items-center justify-center">
<!-- Simulated Glassmorphic Fintech Illustration -->
<div class="relative w-3/4 h-3/4 glass-panel rounded-3xl glow-effect flex items-center justify-center overflow-hidden">
<!-- Decorative elements inside the glass -->
<div class="absolute top-4 right-4 w-16 h-16 rounded-full bg-primary/30 blur-md"></div>
<div class="absolute bottom-8 left-8 w-24 h-24 rounded-full bg-tertiary/20 blur-lg"></div>
<span class="material-symbols-outlined text-primary text-9xl z-10" style="font-variation-settings: 'FILL' 1;">
                    donut_small
                </span>
<!-- Floating card element -->
<div class="absolute top-1/2 right-4 -translate-y-1/2 w-1/2 h-1/3 bg-surface-container-high/80 rounded-xl border border-outline-variant/30 backdrop-blur-md flex flex-col justify-center px-sm rotate-6 shadow-xl">
<div class="w-8 h-2 bg-primary/50 rounded-full mb-2"></div>
<div class="w-full h-1 bg-on-surface-variant/20 rounded-full mb-1"></div>
<div class="w-2/3 h-1 bg-on-surface-variant/20 rounded-full"></div>
</div>
<!-- Floating coin element -->
<div class="absolute bottom-1/4 right-1/4 w-12 h-12 bg-tertiary/80 rounded-full flex items-center justify-center shadow-lg -rotate-12 backdrop-blur-md">
<span class="material-symbols-outlined text-on-tertiary text-xl" style="font-variation-settings: 'FILL' 1;">
                        attach_money
                    </span>
</div>
</div>
</div>
<!-- Text Content -->
<div class="text-center w-full mb-xl">
<h1 class="font-display-lg text-display-lg text-on-surface mb-sm">
                Master Your Finances
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant px-sm">
                Track every dollar, manage budgets, and reach your financial goals with intelligent insights.
            </p>
</div>
</main>
<!-- Bottom Action Area -->
<footer class="w-full px-safe-margin pb-xl z-10 max-w-md mx-auto">
<!-- Progress Indicators -->
<div class="flex justify-center items-center space-x-2 mb-lg">
<div class="w-8 h-2 bg-primary rounded-full"></div>
<div class="w-2 h-2 bg-surface-container-highest rounded-full transition-colors"></div>
<div class="w-2 h-2 bg-surface-container-highest rounded-full transition-colors"></div>
</div>
<!-- Action Buttons -->
<div class="flex items-center justify-between gap-sm">
<button class="px-md py-3 font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors">
                Skip
            </button>
<button class="flex-1 bg-primary text-on-primary py-4 px-md rounded-full font-label-md text-label-md shadow-[0_0_20px_rgba(192,193,255,0.3)] hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
                Next
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</footer>
</body></html>
