<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Spendify - Charts &amp; Reports</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#c0c1ff",
                        "on-tertiary-fixed": "#2a1700",
                        "on-secondary": "#003824",
                        "surface": "#13131b",
                        "surface-bright": "#393841",
                        "primary-fixed-dim": "#c0c1ff",
                        "surface-dim": "#13131b",
                        "outline-variant": "#464554",
                        "on-secondary-fixed": "#002113",
                        "inverse-surface": "#e4e1ed",
                        "surface-variant": "#34343d",
                        "on-tertiary-fixed-variant": "#653e00",
                        "surface-container": "#1f1f27",
                        "on-primary": "#1000a9",
                        "primary-fixed": "#e1e0ff",
                        "background": "#13131b",
                        "primary-container": "#8083ff",
                        "secondary-container": "#00a572",
                        "on-primary-fixed": "#07006c",
                        "tertiary": "#ffb95f",
                        "on-tertiary-container": "#3e2400",
                        "on-tertiary": "#472a00",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "surface-container-highest": "#34343d",
                        "error": "#ffb4ab",
                        "secondary": "#4edea3",
                        "on-background": "#e4e1ed",
                        "on-surface": "#e4e1ed",
                        "secondary-fixed-dim": "#4edea3",
                        "secondary-fixed": "#6ffbbe",
                        "surface-container-high": "#292932",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-primary-container": "#0d0096",
                        "surface-container-low": "#1b1b23",
                        "inverse-primary": "#494bd6",
                        "tertiary-container": "#ca8100",
                        "tertiary-fixed": "#ffddb8",
                        "on-surface-variant": "#c7c4d7",
                        "inverse-on-surface": "#303038",
                        "outline": "#908fa0",
                        "surface-container-lowest": "#0d0d15",
                        "on-secondary-fixed-variant": "#005236",
                        "on-secondary-container": "#00311f",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "primary": "#c0c1ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "32px",
                        "xl": "48px",
                        "base": "4px",
                        "sm": "16px",
                        "xs": "8px",
                        "safe-margin": "20px",
                        "md": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "numeric-xl": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "30px", "fontWeight": "600" }],
                        "headline-lg": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "numeric-xl": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(31, 31, 39, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(199, 196, 215, 0.1);
        }
        
        .glow-effect {
            box-shadow: 0 0 32px rgba(128, 131, 255, 0.1);
        }

        /* SVG Donut Chart Animation Base */
        .donut-segment {
            transition: stroke-dasharray 1s ease-out;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-32">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-safe-margin w-full h-16 backdrop-blur-xl bg-surface/30 sticky top-0 z-40">
<div class="flex items-center gap-xs">
<img class="w-10 h-10 rounded-full object-cover border-2 border-primary/20" data-alt="A small circular avatar showing a professional headshot of a user with a subtle glowing edge in a modern, dark UI setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuChlQIaRXGKRw4eQ7KymNsxJvRWgge4dIiWBI7JFl2yN83_Ayh43wFf3xeZH9sZjGUnTVxyHMQsdpJItTttY9fUyj-2MWNOjt4WOjzqQaQQ1N40FfMSCuIDSheBKIE1YddimpuRJf-H7hvYAdcUxWdEoD7VTSwXjjRzmnsIk-wWarRkhMty3JGZqd0BjR4FwRkRX2HLgh8jLqDc7NMig0-NbMaJKTyUVMweWMSXc79TyxXYjkSCmGcnUQ"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Spendify</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<main class="px-safe-margin pt-sm flex flex-col gap-lg">
<!-- Header & Time Selector -->
<section class="flex flex-col gap-sm">
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Reports</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Insights for this period</p>
</div>
<div class="flex bg-surface-container rounded-full p-1 border border-outline-variant/20">
<button class="flex-1 py-2 font-label-md text-label-md rounded-full text-on-surface-variant">Weekly</button>
<button class="flex-1 py-2 font-label-md text-label-md rounded-full bg-primary-container text-on-primary-container shadow-[0_0_15px_rgba(128,131,255,0.2)]">Monthly</button>
<button class="flex-1 py-2 font-label-md text-label-md rounded-full text-on-surface-variant">Yearly</button>
</div>
</section>
<!-- Category Donut Chart -->
<section class="glass-panel rounded-xl p-md glow-effect flex flex-col gap-sm relative overflow-hidden">
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary/10 rounded-full blur-[40px]"></div>
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Spending by Category</h3>
<div class="flex flex-col md:flex-row items-center gap-lg mt-xs">
<!-- Donut Visual -->
<div class="relative w-48 h-48 flex-shrink-0">
<svg class="w-full h-full -rotate-90 drop-shadow-[0_0_10px_rgba(192,193,255,0.3)]" viewbox="0 0 100 100">
<!-- Background ring -->
<circle cx="50" cy="50" fill="none" r="40" stroke="rgba(70,69,84,0.2)" stroke-width="12"></circle>
<!-- Food: 40% (Primary) -->
<circle class="donut-segment" cx="50" cy="50" fill="none" r="40" stroke="#c0c1ff" stroke-dasharray="100.5 150.7" stroke-dashoffset="0" stroke-linecap="round" stroke-width="12"></circle>
<!-- Rent: 30% (Secondary) -->
<circle class="donut-segment" cx="50" cy="50" fill="none" r="40" stroke="#4edea3" stroke-dasharray="75.3 175.9" stroke-dashoffset="-105" stroke-linecap="round" stroke-width="12"></circle>
<!-- Entertainment: 20% (Tertiary) -->
<circle class="donut-segment" cx="50" cy="50" fill="none" r="40" stroke="#ffb95f" stroke-dasharray="50.2 201" stroke-dashoffset="-185" stroke-linecap="round" stroke-width="12"></circle>
<!-- Other: 10% (Error) -->
<circle class="donut-segment" cx="50" cy="50" fill="none" r="40" stroke="#ffb4ab" stroke-dasharray="25.1 226.1" stroke-dashoffset="-240" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<!-- Center Text -->
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="font-label-md text-label-md text-on-surface-variant">Total</span>
<span class="font-numeric-xl text-numeric-xl text-on-surface mt-[-4px]">$4,250</span>
</div>
</div>
<!-- Legend -->
<div class="flex flex-col gap-xs w-full">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="w-3 h-3 rounded-full bg-primary shadow-[0_0_8px_rgba(192,193,255,0.6)]"></span>
<span class="font-body-md text-body-md text-on-surface">Food</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant">40%</span>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="w-3 h-3 rounded-full bg-secondary shadow-[0_0_8px_rgba(78,222,163,0.6)]"></span>
<span class="font-body-md text-body-md text-on-surface">Rent</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant">30%</span>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="w-3 h-3 rounded-full bg-tertiary shadow-[0_0_8px_rgba(255,185,95,0.6)]"></span>
<span class="font-body-md text-body-md text-on-surface">Entertainment</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant">20%</span>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="w-3 h-3 rounded-full bg-error shadow-[0_0_8px_rgba(255,180,171,0.6)]"></span>
<span class="font-body-md text-body-md text-on-surface">Other</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant">10%</span>
</div>
</div>
</div>
</section>
<!-- Trend Line Chart -->
<section class="glass-panel rounded-xl p-md glow-effect flex flex-col gap-sm">
<div class="flex justify-between items-end">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">6 Month Trend</h3>
<span class="font-body-md text-body-md text-secondary flex items-center gap-1">
<span class="material-symbols-outlined text-sm" data-icon="trending_up">trending_up</span> 12%
                </span>
</div>
<div class="h-48 w-full mt-sm relative">
<!-- Decorative grid lines -->
<div class="absolute inset-0 flex flex-col justify-between border-l border-b border-outline-variant/30 pb-6 pl-1">
<div class="w-full border-t border-outline-variant/10 h-0"></div>
<div class="w-full border-t border-outline-variant/10 h-0"></div>
<div class="w-full border-t border-outline-variant/10 h-0"></div>
<div class="w-full border-t border-outline-variant/10 h-0"></div>
</div>
<!-- Mock SVG Line -->
<svg class="w-full h-full absolute inset-0 pb-6 pl-1 drop-shadow-[0_4px_12px_rgba(128,131,255,0.4)]" preserveaspectratio="none" viewbox="0 0 400 150">
<defs>
<lineargradient id="lineGrad" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#c0c1ff" stop-opacity="0.5"></stop>
<stop offset="100%" stop-color="#c0c1ff" stop-opacity="0"></stop>
</lineargradient>
</defs>
<path d="M0,120 C40,110 60,60 100,70 C140,80 160,30 200,40 C240,50 260,90 300,80 C340,70 360,20 400,10" fill="none" stroke="#c0c1ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
<path d="M0,120 C40,110 60,60 100,70 C140,80 160,30 200,40 C240,50 260,90 300,80 C340,70 360,20 400,10 L400,150 L0,150 Z" fill="url(#lineGrad)"></path>
</svg>
<!-- X Axis Labels -->
<div class="absolute bottom-0 left-1 right-0 flex justify-between font-label-md text-label-md text-on-surface-variant text-[10px]">
<span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-6 left-0 right-0 mx-auto w-[90%] max-w-md z-50 flex justify-around items-center p-2 backdrop-blur-2xl border border-outline-variant/20 bg-surface-container/60 shadow-lg shadow-background/50 rounded-full">
<a class="flex items-center justify-center text-on-surface-variant w-12 h-12 hover:bg-surface-bright/20 rounded-full" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
</a>
<a class="flex items-center justify-center text-on-surface-variant w-12 h-12 hover:bg-surface-bright/20 rounded-full" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
</a>
<a class="flex items-center justify-center text-on-surface-variant w-12 h-12 hover:bg-surface-bright/20 rounded-full" href="#">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
</a>
<a class="flex items-center justify-center bg-primary-container text-on-primary-container rounded-full w-12 h-12 shadow-[0_0_15px_rgba(128,131,255,0.4)] active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="pie_chart" style="font-variation-settings: 'FILL' 1;">pie_chart</span>
</a>
<a class="flex items-center justify-center text-on-surface-variant w-12 h-12 hover:bg-surface-bright/20 rounded-full" href="#">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
</a>
</nav>
</body></html>
