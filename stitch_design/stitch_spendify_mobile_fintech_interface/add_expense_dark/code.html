<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Spendify - Add Expense</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#c0c1ff",
                        "on-tertiary-fixed": "#2a1700",
                        "on-secondary": "#003824",
                        "surface": "#13131b",
                        "surface-bright": "#393841",
                        "primary-fixed-dim": "#c0c1ff",
                        "surface-dim": "#13131b",
                        "outline-variant": "#464554",
                        "on-secondary-fixed": "#002113",
                        "inverse-surface": "#e4e1ed",
                        "surface-variant": "#34343d",
                        "on-tertiary-fixed-variant": "#653e00",
                        "surface-container": "#1f1f27",
                        "on-primary": "#1000a9",
                        "primary-fixed": "#e1e0ff",
                        "background": "#13131b",
                        "primary-container": "#8083ff",
                        "secondary-container": "#00a572",
                        "on-primary-fixed": "#07006c",
                        "tertiary": "#ffb95f",
                        "on-tertiary-container": "#3e2400",
                        "on-tertiary": "#472a00",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "surface-container-highest": "#34343d",
                        "error": "#ffb4ab",
                        "secondary": "#4edea3",
                        "on-background": "#e4e1ed",
                        "on-surface": "#e4e1ed",
                        "secondary-fixed-dim": "#4edea3",
                        "secondary-fixed": "#6ffbbe",
                        "surface-container-high": "#292932",
                        "tertiary-fixed-dim": "#ffb95f",
                        "on-primary-container": "#0d0096",
                        "surface-container-low": "#1b1b23",
                        "inverse-primary": "#494bd6",
                        "tertiary-container": "#ca8100",
                        "tertiary-fixed": "#ffddb8",
                        "on-surface-variant": "#c7c4d7",
                        "inverse-on-surface": "#303038",
                        "outline": "#908fa0",
                        "surface-container-lowest": "#0d0d15",
                        "on-secondary-fixed-variant": "#005236",
                        "on-secondary-container": "#00311f",
                        "on-error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "primary": "#c0c1ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "32px",
                        "xl": "48px",
                        "base": "4px",
                        "sm": "16px",
                        "xs": "8px",
                        "safe-margin": "20px",
                        "md": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "numeric-xl": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "30px", "fontWeight": "600" }],
                        "headline-lg": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "numeric-xl": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(31, 31, 39, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(70, 69, 84, 0.2);
        }
        .glass-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(192, 193, 255, 0.3);
            outline: none;
            text-align: center;
        }
        .glass-input:focus {
            border-bottom-color: #c0c1ff;
        }
        .blinking-cursor {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col items-center">
<div class="w-full max-w-md relative pb-32">
<!-- TopAppBar -->
<header class="backdrop-blur-xl bg-surface/30 flex justify-between items-center px-safe-margin w-full h-16 sticky top-0 z-50">
<button class="text-primary p-2 -ml-2 rounded-full hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Add Expense</h1>
<button class="text-on-surface-variant p-2 -mr-2 rounded-full hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<main class="px-safe-margin pt-lg space-y-xl">
<!-- Amount Input -->
<section class="flex flex-col items-center justify-center pt-md pb-lg">
<p class="font-label-md text-label-md text-on-surface-variant mb-xs">How much did you spend?</p>
<div class="flex items-center justify-center relative">
<span class="font-display-lg text-display-lg text-primary mr-2">$</span>
<input class="glass-input font-display-lg text-display-lg text-on-surface w-48 py-2" placeholder="0.00" type="text" value="45.00"/>
</div>
</section>
<!-- Categories Bento Grid -->
<section class="space-y-sm">
<div class="flex justify-between items-center mb-xs">
<h2 class="font-body-md text-body-md font-semibold text-on-surface">Category</h2>
<button class="font-label-md text-label-md text-primary">See All</button>
</div>
<div class="grid grid-cols-3 gap-sm">
<!-- Category Item: Active -->
<button class="flex flex-col items-center justify-center p-md rounded-2xl bg-primary-container text-on-primary-container shadow-[0_4px_24px_rgba(128,131,255,0.25)] transition-transform active:scale-95">
<span class="material-symbols-outlined mb-xs text-[28px]" style="font-variation-settings: 'FILL' 1;">restaurant</span>
<span class="font-label-md text-label-md">Food</span>
</button>
<!-- Category Item -->
<button class="flex flex-col items-center justify-center p-md rounded-2xl glass-panel text-on-surface-variant hover:bg-surface-variant/50 transition-colors active:scale-95">
<span class="material-symbols-outlined mb-xs text-[28px]">flight_takeoff</span>
<span class="font-label-md text-label-md">Travel</span>
</button>
<!-- Category Item -->
<button class="flex flex-col items-center justify-center p-md rounded-2xl glass-panel text-on-surface-variant hover:bg-surface-variant/50 transition-colors active:scale-95">
<span class="material-symbols-outlined mb-xs text-[28px]">shopping_bag</span>
<span class="font-label-md text-label-md">Shopping</span>
</button>
<!-- Category Item -->
<button class="flex flex-col items-center justify-center p-md rounded-2xl glass-panel text-on-surface-variant hover:bg-surface-variant/50 transition-colors active:scale-95">
<span class="material-symbols-outlined mb-xs text-[28px]">receipt_long</span>
<span class="font-label-md text-label-md">Bills</span>
</button>
<!-- Category Item -->
<button class="flex flex-col items-center justify-center p-md rounded-2xl glass-panel text-on-surface-variant hover:bg-surface-variant/50 transition-colors active:scale-95">
<span class="material-symbols-outlined mb-xs text-[28px]">directions_car</span>
<span class="font-label-md text-label-md">Transport</span>
</button>
<!-- Category Item -->
<button class="flex flex-col items-center justify-center p-md rounded-2xl glass-panel text-on-surface-variant hover:bg-surface-variant/50 transition-colors active:scale-95">
<span class="material-symbols-outlined mb-xs text-[28px]">more_horiz</span>
<span class="font-label-md text-label-md">Other</span>
</button>
</div>
</section>
<!-- Details Glass Card -->
<section class="glass-panel rounded-3xl p-md space-y-md">
<!-- Payment Method -->
<div>
<h3 class="font-label-md text-label-md text-on-surface-variant mb-xs">Payment Method</h3>
<div class="flex gap-xs">
<button class="flex-1 py-2 px-4 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md shadow-[0_0_15px_rgba(0,165,114,0.3)]">Card</button>
<button class="flex-1 py-2 px-4 rounded-full border border-outline-variant/50 text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant/30 transition-colors">Cash</button>
<button class="flex-1 py-2 px-4 rounded-full border border-outline-variant/50 text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant/30 transition-colors">UPI</button>
</div>
</div>
<hr class="border-outline-variant/30"/>
<!-- Date & Time -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined">calendar_today</span>
</div>
<div>
<p class="font-body-md text-body-md text-on-surface">Today, 2:30 PM</p>
</div>
</div>
<button class="text-primary font-label-md text-label-md">Edit</button>
</div>
<hr class="border-outline-variant/30"/>
<!-- Recurring Toggle -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined">autorenew</span>
</div>
<div>
<p class="font-body-md text-body-md text-on-surface">Recurring Expense</p>
</div>
</div>
<!-- Toggle Switch -->
<button class="w-12 h-6 bg-surface-container-high rounded-full relative transition-colors duration-200">
<div class="absolute left-1 top-1 w-4 h-4 rounded-full bg-outline-variant transition-transform duration-200"></div>
</button>
</div>
<hr class="border-outline-variant/30"/>
<!-- Note -->
<div>
<div class="flex items-start gap-sm">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">edit_note</span>
</div>
<textarea class="w-full bg-transparent border-none text-on-surface font-body-md focus:ring-0 placeholder-on-surface-variant/50 resize-none h-20" placeholder="Add a note... (e.g., Lunch with client)"></textarea>
</div>
</div>
</section>
</main>
<!-- Fixed Action Button Area -->
<div class="fixed bottom-0 left-0 right-0 p-safe-margin pb-xl bg-gradient-to-t from-background via-background/90 to-transparent z-40 max-w-md mx-auto">
<button class="w-full py-4 rounded-full bg-primary text-on-primary font-headline-lg-mobile text-headline-lg-mobile shadow-[0_8px_32px_rgba(192,193,255,0.4)] active:scale-95 transition-transform">
                Save Expense
            </button>
</div>
</div>
</body></html>
